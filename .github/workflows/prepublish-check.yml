name: Prepublish check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run prepublishOnly
        run: npm run prepublishOnly
